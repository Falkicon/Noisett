<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabric UX Designer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <img src="design-bot.png" alt="Fabric UX Designer" class="header-logo">
      </div>
      <div class="header-status">
        <img id="status-bot" src="ill-bot-off.png" alt="Status" class="status-bot">
      </div>
      <a id="director-nav" href="director.html" class="btn btn-outline hidden">Director</a>
    </header>

    <!-- Main Content -->
    <main class="main">
      <div class="user-layout">
        <!-- History Sidebar -->
        <aside class="history-sidebar panel">
          <div class="sidebar-header">
            <h2 class="sidebar-title prompt-title">History</h2>
            <div class="history-filter">
              <button id="filter-all" class="filter-btn active" data-filter="all">All</button>
              <button id="filter-favorites" class="filter-btn" data-filter="favorites">Favorites</button>
            </div>
          </div>
          <div id="history-list" class="history-sidebar-list">
            <!-- History items populated dynamically -->
          </div>
          <div id="history-empty" class="empty-state-small">
            <img src="ill-image.png" alt="" class="empty-icon-small">
            <p>No generations yet</p>
          </div>
        </aside>

        <!-- Main Generation Panel -->
        <div class="generation-panel">
          <!-- Input Panel -->
          <div class="panel panel-input">
            <div class="input-split-layout">
              <!-- Left side: Prompt input -->
              <div class="input-left">
                <div class="form-group">
                  <label class="prompt-title">Prompt</label>
                  <textarea
                    id="prompt"
                    placeholder="blue shield with a white padlock on it"
                    rows="4"
                  ></textarea>
                  <div class="prompt-footer">
                    <span id="prompt-tip" class="prompt-tip"></span>
                    <span class="char-count"><span id="char-current">0</span>/500</span>
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label for="asset-type" class="prompt-title">Asset Type</label>
                    <select id="asset-type">
                      <option value="product">Product Illustrations</option>
                      <option value="icons">Icons (Fluent 2)</option>
                      <option value="logo">Logo Illustrations</option>
                      <option value="premium">Premium Illustrations</option>
                    </select>
                  </div>
                </div>

                <div class="generate-row">
                  <button id="generate-btn" style="width: 150px;" class="btn btn-primary btn-medium">
                    Generate
                  </button>
                  <span class="generate-disclaimer">* AI-generated. Mostly behaves.</span>
                </div>
              </div>

              <!-- Right side: Restatement preview -->
              <div class="input-right">
                <div class="restatement-preview">
                  <span id="restatement-pre" class="restatement-part restatement-pre"></span><span id="restatement-user" class="restatement-part restatement-user"></span><span id="restatement-post" class="restatement-part restatement-post"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Results Panel -->
          <div class="panel panel-results">
            <div id="results-empty" class="empty-state">
              <img src="ill-image.png" alt="" class="empty-icon">
              <p>Your generated images will appear here</p>
            </div>
            <div id="results-loading" class="loading-state hidden">
              <div class="spinner"></div>
              <p>Generating <span id="loading-count">1</span> variations...</p>
              <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
            </div>
            <div id="results-grid" class="image-grid hidden">
              <!-- Images populated dynamically -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Confirmation Dialog -->
  <div id="confirm-dialog" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="confirm-title">Confirm</h3>
      </div>
      <div class="modal-body">
        <p id="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
